name: Deploy

# Deploys only what CI has already proved.
#
# `workflow_run` rather than `push`: this waits for the CI workflow to finish
# and refuses to deploy unless it passed. Deploying on push and running tests in
# parallel means a failing build can reach production before anyone sees red.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  # Manual, for a rollback or a re-run.
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (defaults to the current commit)
        required: false

concurrency:
  # Never two deploys at once — the second would race the first's migration.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  guard:
    name: Did CI pass?
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding"

  build:
    name: Build and push images
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "value=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          # Layer cache in the registry — npm ci is the slow part and it only
          # changes when the lockfile does.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      tag: ${{ steps.tag.outputs.value }}

  deploy:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}

    steps:
      - name: Back up before touching anything
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            # A migration is the one step of a deploy that cannot be rolled back
            # by swapping the image. Take a verified backup first, every time.
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              exec -T postgres sh -c 'pg_isready -U fortunex'
            ./ops/backup.sh

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            export TAG=${{ needs.build.outputs.tag }}

            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # `migrate` runs to completion before api and worker start — the
            # compose file gates them on it.
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              up -d --remove-orphans

            docker image prune -f --filter 'until=168h'

      - name: Verify it actually came up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}

            # Readiness, not liveness — a process that is up but cannot reach
            # the database is not a successful deploy.
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml --env-file .env.production \
                   exec -T api node -e "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API is ready"
                exit 0
              fi
              echo "waiting for readiness ($i/30)"
              sleep 5
            done

            echo "API never became ready — dumping logs"
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 100 api migrate
            exit 1

      - name: Roll back on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.DEPLOY_PATH }}
            echo "Deploy failed. Rolling the images back to the previous tag."
            # Deliberately does NOT roll the database back. A migration that has
            # run may already have been written against, and restoring over it
            # would lose whatever happened since. Restoring from the backup taken
            # above is a human decision, not an automatic one.
            export TAG=$(cat .last-good-tag 2>/dev/null || echo latest)
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            exit 1

      - name: Remember this tag as good
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH }}
            echo "${{ needs.build.outputs.tag }}" > .last-good-tag
