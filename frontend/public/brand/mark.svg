<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Platform">
  <!--
    The neutral fallback mark.

    Shown only while an operator has not uploaded their own icon. It is the
    same glyph BrandMark draws in the header — a rising line breaking out of
    its box — so an unbranded install is visibly consistent rather than
    looking like two different placeholders.

    Drawn rather than photographed, so it stays crisp at 16px and recolours by
    editing one value.
  -->
  <rect width="64" height="64" rx="12" fill="#FF7A1A"/>
  <g fill="none" stroke="#0B0F16" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 43 l12-14 10 10 14-19"/>
    <path d="M42 20 h10 v10"/>
  </g>
</svg>
